<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLINDMAZE</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="welcomeScreen">
        <div class="logo-area">
          <div class="logo-icon">
            <div class="logo-box pattern-1"></div>
            <div class="logo-box pattern-2"></div>
            <div class="logo-box pattern-3"></div>
            <div class="logo-box pattern-4"></div>
          </div>
          <h1>BlindMaze</h1>
        </div>

        <div class="login-form">
          <input
            type="text"
            id="username-input"
            placeholder="Your name"
            maxlength="15"
            autocomplete="off"
          />
          <button id="btn-play" disabled>Start</button>
        </div>

        <div class="welcome-actions">
          <button id="btn-open-leaderboard">Leaderboard</button>
          <button id="btn-open-instructions">Show Instructions</button>
        </div>
      </div>
    </div>

    <script src="/js/script.js"></script>
  </body>
</html>
